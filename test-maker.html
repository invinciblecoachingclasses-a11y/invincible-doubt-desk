<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam & Worksheet Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-3xl mx-auto p-4 md:py-8">
    
    <!-- Top Navigation Bar -->
    <div class="flex justify-between items-center mb-6 no-print">
      <a href="/history.html" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-1.5 rounded-lg transition">
        ← Exam Archive (7-Day History)
      </a>
      <button id="logoutBtn" class="text-xs text-slate-500 hover:text-slate-800 font-medium">Logout</button>
    </div>

    <!-- App Header -->
    <div class="mb-6 text-center no-print">
      <h1 class="text-3xl font-extrabold text-indigo-700 tracking-tight">Exam & Worksheet Studio</h1>
      <p class="text-sm text-slate-500 mt-1">Generate print-ready school question papers from handwritten drafts, NCERT topics, or pasted text.</p>
    </div>

    <!-- Generator Setup Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6 mb-8 no-print">
      
      <!-- Input Mode Switcher Tabs -->
      <div class="flex rounded-xl bg-slate-100 p-1 mb-5 text-xs font-bold">
        <button id="tabCamera" onclick="switchMode('camera')" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-700">📸 Camera / Photo</button>
        <button id="tabNCERT" onclick="switchMode('ncert')" class="flex-1 py-2 rounded-lg text-slate-600">📚 NCERT Chapter</button>
        <button id="tabText" onclick="switchMode('text')" class="flex-1 py-2 rounded-lg text-slate-600">📋 Copy-Paste Text</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">School / Institute Name</label>
          <input id="schoolName" type="text" placeholder="e.g., Delhi Public School" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Subject</label>
          <input id="subject" type="text" placeholder="e.g., Science / Mathematics" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Class / Grade</label>
          <input id="classGrade" type="text" placeholder="e.g., Class 10" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Exam Type & Total Marks</label>
          <div class="flex gap-2">
            <select id="examType" class="flex-1 border border-slate-300 rounded-lg p-2.5 text-sm bg-white">
              <option value="Unit Assessment">Unit Test</option>
              <option value="Periodic Test">Periodic Test</option>
              <option value="Formative Assessment (FA)">Formative (FA)</option>
              <option value="Summative Assessment (SA)">Summative (SA)</option>
            </select>
            <input id="totalMarks" type="number" placeholder="25" value="25" class="w-20 border border-slate-300 rounded-lg p-2.5 text-sm" />
          </div>
        </div>
      </div>

      <!-- Mode 1: Camera Photo View -->
      <div id="viewCamera" class="mb-5">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Snap Photos of Draft or Textbook Page</label>
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-indigo-300 bg-indigo-50/50 hover:bg-indigo-50 rounded-xl p-6 cursor-pointer transition">
          <span class="text-sm font-medium text-indigo-900">Click to Snap Photo or Upload Images</span>
          <span class="text-xs text-slate-500 mt-1">Supports handwritten pages and book diagrams</span>
          <input id="cameraInput" type="file" accept="image/*" multiple capture="environment" class="hidden" />
        </label>
        <div id="previewContainer" class="flex gap-2 mt-3 overflow-x-auto"></div>
      </div>

      <!-- Mode 2: NCERT Topic View -->
      <div id="viewNCERT" class="mb-5 hidden">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Chapter Name / NCERT Exercise Topics</label>
        <input id="chapterName" type="text" placeholder="e.g., Chapter 4: Quadratic Equations (Exercise 4.2 & 4.3 word problems)" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>

      <!-- Mode 3: Copy-Paste Text View -->
      <div id="viewText" class="mb-5 hidden">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Paste Raw Questions / Notes / PDF Text</label>
        <textarea id="rawText" rows="4" placeholder="Paste your question bank or copied PDF text here..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
      </div>

      <button id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition disabled:bg-slate-400">
        Generate Print-Ready Exam & Marking Key
      </button>
    </div>

    <!-- Output Paper View -->
    <div id="resultCard" class="hidden">
      <div class="flex gap-3 mb-4 no-print">
        <button onclick="window.print()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow transition">
          🖨️ Print / Save Student Paper (PDF)
        </button>
        <button id="toggleAnswersBtn" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl shadow transition">
          👁️ Toggle Marking Scheme
        </button>
      </div>

      <div id="printable-area" class="bg-white rounded-2xl border border-slate-300 p-8 shadow-sm text-slate-900">
        <div class="text-center border-b-2 border-slate-800 pb-4 mb-6">
          <h2 id="paperSchool" class="text-2xl font-black uppercase tracking-wide">Academic Institution</h2>
          <h3 id="paperTitle" class="text-lg font-bold text-slate-700 mt-1">Periodic Test</h3>
          <div class="flex justify-between items-center text-xs font-semibold uppercase tracking-wider text-slate-600 mt-4 border-t pt-2 border-slate-200">
            <span><strong>Subject:</strong> <span id="paperSubject"></span></span>
            <span><strong>Class:</strong> <span id="paperClass"></span></span>
            <span><strong>Time:</strong> <span id="paperDuration"></span> mins</span>
            <span><strong>Max Marks:</strong> <span id="paperMarks"></span></span>
          </div>
        </div>

        <div class="mb-6 text-xs text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-200">
          <strong class="block mb-1 text-slate-800">General Instructions:</strong>
          <ul id="paperInstructions" class="list-disc pl-4 space-y-0.5"></ul>
        </div>

        <div id="paperSections" class="space-y-6"></div>
      </div>
    </div>

  </div>

  <script>
    const supabaseUrl = 'https://cbgwbzidkmcefoithipp.supabase.co';
    const supabaseAnonKey = 'YOUR_SUPABASE_ANON_KEY_HERE';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

    let currentUser = null;
    let activeMode = 'camera';
    let base64Images = [];
    let showAnswers = false;

    // Check login state on load
    async function checkAuth() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      currentUser = user;

      // Check if loading an exam from 7-day history session
      const stored = sessionStorage.getItem('currentExam');
      if (stored) {
        try {
          renderExam(JSON.parse(stored));
          sessionStorage.removeItem('currentExam');
        } catch(e) {}
      }
    }
    checkAuth();

    function switchMode(mode) {
      activeMode = mode;
      document.getElementById('viewCamera').classList.toggle('hidden', mode !== 'camera');
      document.getElementById('viewNCERT').classList.toggle('hidden', mode !== 'ncert');
      document.getElementById('viewText').classList.toggle('hidden', mode !== 'text');

      ['tabCamera', 'tabNCERT', 'tabText'].forEach(id => {
        const btn = document.getElementById(id);
        const isActive = (id === 'tab' + mode.toUpperCase() || (mode === 'camera' && id === 'tabCamera') || (mode === 'ncert' && id === 'tabNCERT') || (mode === 'text' && id === 'tabText'));
        btn.className = isActive 
          ? 'flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-700 font-bold' 
          : 'flex-1 py-2 rounded-lg text-slate-600';
      });
    }

    const cameraInput = document.getElementById('cameraInput');
    const previewContainer = document.getElementById('previewContainer');

    cameraInput.addEventListener('change', (e) => {
      Array.from(e.target.files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          base64Images.push(ev.target.result);
          const img = document.createElement('img');
          img.src = ev.target.result;
          img.className = 'w-16 h-16 object-cover rounded-lg border border-slate-300';
          previewContainer.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    document.getElementById('generateBtn').addEventListener('click', async () => {
      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.innerText = 'AI Structuring Test & Marking Scheme...';

      try {
        const payload = {
          inputType: activeMode,
          schoolName: document.getElementById('schoolName').value,
          subject: document.getElementById('subject').value,
          classGrade: document.getElementById('classGrade').value,
          totalMarks: document.getElementById('totalMarks').value,
          examType: document.getElementById('examType').value,
          chapterName: document.getElementById('chapterName').value,
          rawText: document.getElementById('rawText').value,
          imageBase64Array: activeMode === 'camera' ? base64Images : []
        };

        const res = await fetch('/api/ocr-paper', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        // Auto-save to Supabase (7-Day retention)
        if (currentUser) {
          await supabaseClient.from('exams').insert({
            user_id: currentUser.id,
            school_name: data.exam.school_name,
            subject: data.exam.subject,
            class_grade: data.exam.class_grade,
            title: data.exam.title,
            total_marks: data.exam.total_marks,
            exam_data: data.exam
          });
        }

        renderExam(data.exam);
      } catch (err) {
        alert('Generation failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Generate Print-Ready Exam & Marking Key';
      }
    });

    function renderExam(exam) {
      document.getElementById('paperSchool').innerText = exam.school_name || 'Academic Institution';
      document.getElementById('paperTitle').innerText = exam.title || 'Periodic Assessment';
      document.getElementById('paperSubject').innerText = exam.subject || 'General';
      document.getElementById('paperClass').innerText = exam.class_grade || '';
      document.getElementById('paperDuration').innerText = exam.duration_minutes || '45';
      document.getElementById('paperMarks').innerText = exam.total_marks || '25';

      const instrList = document.getElementById('paperInstructions');
      instrList.innerHTML = '';
      (exam.instructions || []).forEach(inst => {
        const li = document.createElement('li');
        li.innerText = inst;
        instrList.appendChild(li);
      });

      const sectionsContainer = document.getElementById('paperSections');
      sectionsContainer.innerHTML = '';

      exam.sections.forEach(sec => {
        const secDiv = document.createElement('div');
        secDiv.innerHTML = `<h4 class="font-bold text-sm tracking-wider uppercase border-b pb-1 mb-3 text-slate-800">${sec.section_name}</h4>`;
        
        const qList = document.createElement('div');
        qList.className = 'space-y-4';

        sec.questions.forEach(q => {
          const qItem = document.createElement('div');
          qItem.className = 'text-sm';
          qItem.innerHTML = `
            <div class="flex justify-between items-baseline gap-4">
              <span class="font-semibold text-slate-900">Q${q.question_number}. ${q.question_text}</span>
              <span class="text-xs font-bold text-slate-600 whitespace-nowrap">[${q.marks} Mark${q.marks > 1 ? 's' : ''}]</span>
            </div>
            <div class="answer-key-box hidden mt-2 text-xs bg-emerald-50 border border-emerald-200 text-emerald-900 p-2.5 rounded-lg">
              <strong>Marking Scheme / Answer:</strong> ${q.answer_key}
            </div>
          `;
          qList.appendChild(qItem);
        });

        secDiv.appendChild(qList);
        sectionsContainer.appendChild(secDiv);
      });

      const resultCard = document.getElementById('resultCard');
      resultCard.classList.remove('hidden');
      resultCard.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('toggleAnswersBtn').addEventListener('click', () => {
      showAnswers = !showAnswers;
      document.querySelectorAll('.answer-key-box').forEach(box => {
        box.classList.toggle('hidden', !showAnswers);
      });
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
