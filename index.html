<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Invincible Doubt Desk</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #101828;
    }

    .container {
      width: min(720px, 94%);
      margin: 30px auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      color: #09244a;
    }

    .header p {
      margin-top: 7px;
      color: #667085;
      font-size: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .subject {
      padding: 15px 8px;
      border: 2px solid #d7dee8;
      border-radius: 14px;
      background: white;
      color: #1769c2;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .subject.active {
      background: #09244a;
      color: white;
      border-color: #09244a;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      padding: 18px;
      border: 2px solid #dce2ea;
      border-radius: 18px;
      font-size: 18px;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #1769c2;
    }

    .photo-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .photo-btn {
      padding: 17px 10px;
      border: 2px solid #d7dee8;
      border-radius: 15px;
      background: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .photo-btn:hover {
      background: #f3f6fa;
    }

    #imageInput {
      display: none;
    }

    #imagePreview {
      display: none;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 15px;
      border: 2px solid #e1e6ed;
    }

    #removeImage {
      display: none;
      margin: 10px auto 0;
      border: none;
      background: none;
      color: #d92d20;
      font-weight: 700;
      cursor: pointer;
    }

    .ask-btn {
      width: 100%;
      margin-top: 20px;
      padding: 19px;
      border: none;
      border-radius: 16px;
      background: #ed7118;
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .ask-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      font-weight: 700;
      color: #1769c2;
    }

    .answer-box {
      display: none;
      margin-top: 25px;
      padding: 22px;
      background: #f8fafc;
      border-radius: 20px;
      border: 2px solid #e1e7ef;
    }

    .logic-title {
      font-size: 30px;
      font-weight: 900;
      color: #09244a;
      margin-bottom: 18px;
    }

    .answer-text {
      white-space: pre-wrap;
      font-size: 18px;
      line-height: 1.65;
      color: #172033;
    }

    .feedback {
      display: none;
      margin-top: 22px;
    }

    .feedback-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .feedback-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .feedback-btn {
      padding: 14px 10px;
      border-radius: 13px;
      border: 2px solid #d7dee8;
      background: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .teacher-btn {
      background: #09244a;
      color: white;
      border-color: #09244a;
    }

    .footer {
      text-align: center;
      color: #667085;
      margin: 25px 0;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        margin: 18px auto;
      }

      .card {
        padding: 18px;
      }

      .header h1 {
        font-size: 27px;
      }

      .subjects {
        grid-template-columns: 1fr;
      }

      .photo-buttons {
        grid-template-columns: 1fr;
      }

      textarea {
        font-size: 17px;
      }

      .logic-title {
        font-size: 26px;
      }

      .answer-text {
        font-size: 17px;
      }

      .feedback-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Invincible Doubt Desk</h1>
    <p>Ask your doubt. Understand the logic.</p>
  </div>

  <div class="card">

    <label>Select Subject</label>

    <div class="subjects">

      <button
        type="button"
        class="subject active"
        data-subject="Mathematics">
        Mathematics
      </button>

      <button
        type="button"
        class="subject"
        data-subject="Physics">
        Physics
      </button>

      <button
        type="button"
        class="subject"
        data-subject="Chemistry">
        Chemistry
      </button>

    </div>

    <label for="question">
      Your Question
    </label>

    <textarea
      id="question"
      placeholder="Type your question here..."
    ></textarea>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
    >

    <div class="photo-buttons">

      <button
        type="button"
        class="photo-btn"
        id="cameraBtn">
        📷 Take Photo
      </button>

      <button
        type="button"
        class="photo-btn"
        id="uploadBtn">
        🖼️ Upload Photo
      </button>

    </div>

    <img
      id="imagePreview"
      alt="Selected question"
    >

    <button
      type="button"
      id="removeImage">
      Remove Photo
    </button>

    <button
      type="button"
      class="ask-btn"
      id="askBtn">
      ASK AI
    </button>

    <div
      class="loading"
      id="loading">
      Thinking... Please wait.
    </div>

    <div
      class="answer-box"
      id="answerBox">

      <div class="logic-title">
        Aao Logic Samjhate Hain
      </div>

      <div
        class="answer-text"
        id="answerText">
      </div>

      <div
        class="feedback"
        id="feedback">

        <div class="feedback-title">
          Still confused?
        </div>

        <div class="feedback-buttons">

          <button
            type="button"
            class="feedback-btn"
            id="againBtn">
            Not Satisfied — Explain Again
          </button>

          <button
            type="button"
            class="feedback-btn teacher-btn"
            id="teacherBtn">
            Teacher Help
          </button>

        </div>

      </div>

    </div>

  </div>

  <div class="footer">
    © Invincible Coaching Classes
  </div>

</div>


<script>

  let selectedSubject = "Mathematics";
  let selectedImage = null;

  const questionInput =
    document.getElementById("question");

  const imageInput =
    document.getElementById("imageInput");

  const imagePreview =
    document.getElementById("imagePreview");

  const removeImageButton =
    document.getElementById("removeImage");

  const askButton =
    document.getElementById("askBtn");

  const loading =
    document.getElementById("loading");

  const answerBox =
    document.getElementById("answerBox");

  const answerText =
    document.getElementById("answerText");

  const feedback =
    document.getElementById("feedback");


  // SUBJECT SELECTION

  document
    .querySelectorAll(".subject")
    .forEach(function(button) {

      button.addEventListener("click", function() {

        document
          .querySelectorAll(".subject")
          .forEach(function(btn) {
            btn.classList.remove("active");
          });

        button.classList.add("active");

        selectedSubject =
          button.getAttribute("data-subject");

      });

    });


  // UPLOAD PHOTO

  document
    .getElementById("uploadBtn")
    .addEventListener("click", function() {

      imageInput.removeAttribute("capture");

      imageInput.click();

    });


  // TAKE PHOTO

  document
    .getElementById("cameraBtn")
    .addEventListener("click", function() {

      imageInput.setAttribute(
        "capture",
        "environment"
      );

      imageInput.click();

    });


  // IMAGE SELECTED

  imageInput.addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];

      if (!file) {
        return;
      }

      if (!file.type.startsWith("image/")) {

        alert(
          "Please select an image."
        );

        return;
      }

      const reader =
        new FileReader();

      reader.onload = function() {

        const result =
          reader.result;

        selectedImage = {
          data: result.split(",")[1],
          mimeType: file.type
        };

        imagePreview.src = result;

        imagePreview.style.display =
          "block";

        removeImageButton.style.display =
          "block";

      };

      reader.readAsDataURL(file);

    }
  );


  // REMOVE PHOTO

  removeImageButton.addEventListener(
    "click",
    function() {

      selectedImage = null;

      imageInput.value = "";

      imagePreview.src = "";

      imagePreview.style.display =
        "none";

      removeImageButton.style.display =
        "none";

    }
  );


  // ASK AI

  askButton.addEventListener(
    "click",
    async function() {

      const question =
        questionInput.value.trim();

      if (!question && !selectedImage) {

        alert(
          "Please type a question or upload a photo."
        );

        return;
      }

      askButton.disabled = true;

      loading.style.display =
        "block";

      answerBox.style.display =
        "none";

      feedback.style.display =
        "none";

      try {

        const response =
          await fetch(
            "/api/ask",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                subject:
                  selectedSubject,

                question:
                  question,

                image:
                  selectedImage

              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to get answer."
          );

        }


        answerText.textContent =
          cleanAnswer(data.answer);


        answerBox.style.display =
          "block";

        feedback.style.display =
          "block";


        answerBox.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });


      } catch (error) {

        answerBox.style.display =
          "block";

        answerText.textContent =
          "Sorry, answer nahi aa paaya.\n\n" +
          error.message;

      } finally {

        askButton.disabled = false;

        loading.style.display =
          "none";

      }

    }
  );


  // CLEAN AI RESPONSE

  function cleanAnswer(text) {

    if (!text) {
      return "";
    }

    return text
      .replace(/#{1,6}\s?/g, "")
      .replace(/\*\*/g, "")
      .replace(/\*/g, "")
      .replace(/\\text\{([^}]*)\}/g, "$1")
      .replace(/\\mathrm\{([^}]*)\}/g, "$1")
      .replace(/\\times/g, "×")
      .replace(/\\div/g, "÷")
      .replace(/\\cdot/g, "×")
      .replace(/\\sqrt\{([^}]*)\}/g, "√($1)")
      .replace(/\\left/g, "")
      .replace(/\\right/g, "")
      .replace(/\\\[/g, "")
      .replace(/\\\]/g, "")
      .replace(/\$\$/g, "")
      .replace(/\$/g, "")
      .replace(/```[\s\S]*?```/g, "")
      .trim();

  }


  // NOT SATISFIED

  document
    .getElementById("againBtn")
    .addEventListener(
      "click",
      function() {

        const oldQuestion =
          questionInput.value.trim();

        const newQuestion =
          oldQuestion +
          "\n\nExplain this again in an even simpler way. Use a small example if helpful.";

        questionInput.value =
          newQuestion;

        askButton.click();

      }
    );


  // TEACHER HELP

  document
    .getElementById("teacherBtn")
    .addEventListener(
      "click",
      function() {

        alert(
          "Please contact your Invincible Coaching Classes teacher for personal help."
        );

      }
    );

</script>

</body>
</html>
