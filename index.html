<script>
  let selectedSubject = "Mathematics";

  function selectSubject(button) {
    document.querySelectorAll(".subject").forEach(function(btn) {
      btn.classList.remove("active");
    });

    button.classList.add("active");
    selectedSubject = button.innerText.trim();
  }

  async function askAI() {
    const question = document.getElementById("question").value.trim();

    if (!question) {
      alert("Please type your question.");
      return;
    }

    const button = document.querySelector(".ask-btn");

    button.disabled = true;
    button.innerText = "SOLVING...";

    try {
      const response = await fetch("/api/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          subject: selectedSubject,
          question: question
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Something went wrong.");
      }

      alert(data.answer);

    } catch (error) {
      console.error(error);
      alert("AI could not solve the doubt. Please try again.");
    } finally {
      button.disabled = false;
      button.innerText = "ASK AI";
    }
  }
</script>
