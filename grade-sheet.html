<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Exam Sheet Grader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-report, #printable-report * { visibility: visible; }
      #printable-report { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-2xl mx-auto p-4 md:py-8">
    
    <!-- Header -->
    <div class="mb-6 text-center no-print">
      <h1 class="text-3xl font-extrabold text-emerald-700 tracking-tight">AI Answer Sheet Grader</h1>
      <p class="text-sm text-slate-500 mt-1">Snap a student's answer sheet $\rightarrow$ Instant human-like step evaluation & digital mark tally.</p>
    </div>

    <!-- Upload Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6 no-print">
      <div class="mb-4">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Subject & Exam Context (Optional)</label>
        <input id="examContext" type="text" placeholder="e.g., Class 10 Math Periodic Test (Quadratic Equations)" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
      </div>

      <div class="mb-5">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Snap Photos of Student Answer Sheet</label>
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-emerald-300 bg-emerald-50/50 hover:bg-emerald-50 rounded-xl p-6 cursor-pointer transition">
          <svg class="w-8 h-8 text-emerald-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <span class="text-sm font-medium text-emerald-900">Snap Student Answer Pages</span>
          <span class="text-xs text-slate-500 mt-1">Multiple photos supported</span>
          <input id="sheetCameraInput" type="file" accept="image/*" multiple capture="environment" class="hidden" />
        </label>
        <div id="sheetPreviews" class="flex gap-2 mt-3 overflow-x-auto"></div>
      </div>

      <button id="gradeBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition disabled:bg-slate-400">
        Grade Answer Sheet with AI
      </button>
    </div>

    <!-- Evaluation Results -->
    <div id="gradingResult" class="hidden">
      <div class="flex gap-3 mb-4 no-print">
        <button onclick="window.print()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl shadow transition">
          🖨️ Print / Save Report Card
        </button>
      </div>

      <div id="printable-report" class="bg-white rounded-2xl border border-slate-300 p-6 shadow-sm">
        <div class="border-b-2 border-slate-800 pb-4 mb-5 flex justify-between items-end">
          <div>
            <h2 id="resStudentName" class="text-xl font-black text-slate-900">Student: Aryan Sharma</h2>
            <p id="resRoll" class="text-xs font-semibold text-slate-500 mt-0.5">Roll No: 14</p>
          </div>
          <div class="text-right">
            <span class="text-xs text-slate-500 block uppercase font-bold">Total Score</span>
            <span class="text-2xl font-black text-emerald-600"><span id="resTotalMarks">0</span> / <span id="resMaxMarks">0</span></span>
          </div>
        </div>

        <h3 class="font-bold text-sm tracking-wider uppercase text-slate-700 mb-3">Question-by-Question Grading:</h3>
        <div id="questionsList" class="space-y-4"></div>
      </div>
    </div>

  </div>

  <script>
    const sheetCameraInput = document.getElementById('sheetCameraInput');
    const sheetPreviews = document.getElementById('sheetPreviews');
    const gradeBtn = document.getElementById('gradeBtn');
    const gradingResult = document.getElementById('gradingResult');
    let sheetImages = [];

    sheetCameraInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          sheetImages.push(event.target.result);
          const img = document.createElement('img');
          img.src = event.target.result;
          img.className = 'w-16 h-16 object-cover rounded-lg border border-slate-300';
          sheetPreviews.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    gradeBtn.addEventListener('click', async () => {
      if (sheetImages.length === 0) {
        alert('Please snap at least one photo of the student answer sheet!');
        return;
      }

      gradeBtn.disabled = true;
      gradeBtn.innerText = 'Evaluating Handwriting & Checking Steps...';

      try {
        const res = await fetch('/api/grade-sheet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sheetImagesBase64: sheetImages,
            examData: { context: document.getElementById('examContext').value || 'Standard Exam' }
          }),
        });

        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        renderEvaluation(data.evaluation);
      } catch (err) {
        alert('Grading failed: ' + err.message);
      } finally {
        gradeBtn.disabled = false;
        gradeBtn.innerText = 'Grade Answer Sheet with AI';
      }
    });

    function renderEvaluation(evalData) {
      document.getElementById('resStudentName').innerText = `Student: ${evalData.student_name || 'Anonymous'}`;
      document.getElementById('resRoll').innerText = `Roll No: ${evalData.roll_number || 'N/A'}`;
      document.getElementById('resTotalMarks').innerText = evalData.total_marks_obtained || 0;
      document.getElementById('resMaxMarks').innerText = evalData.max_marks || 0;

      const qList = document.getElementById('questionsList');
      qList.innerHTML = '';

      (evalData.question_evaluations || []).forEach((q) => {
        const div = document.createElement('div');
        div.className = 'p-3 bg-slate-50 border border-slate-200 rounded-xl';
        div.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-sm text-slate-800">Question ${q.question_number}</span>
            <span class="text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">
              ${q.marks_awarded} / ${q.max_marks} Marks
            </span>
          </div>
          <p class="text-xs text-slate-600 mt-1"><strong>Teacher Feedback:</strong> ${q.feedback}</p>
        `;
        qList.appendChild(div);
      });

      gradingResult.classList.remove('hidden');
      gradingResult.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
