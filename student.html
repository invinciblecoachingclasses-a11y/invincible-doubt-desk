<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Doubt Solver & Academic Copilot | Invincible 360</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">
  
  <!-- Marked.js Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- MathJax for LaTeX Equation Rendering -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script>
    window.MathJax = {
      tex: { 
        inlineMath: [['$', '$'], ['\\(', '\\)']], 
        displayMath: [['$$', '$$'], ['\\[', '\\]']] 
      }
    };
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }
    .latex-rendered mjx-container {
      color: #00e5ff !important;
      font-size: 110% !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-cyan-500 selection:text-slate-950">
  <div class="max-w-2xl mx-auto p-4 md:py-8">
    
    <!-- Top Navigation HUD -->
    <header class="flex justify-between items-center mb-6 bg-slate-900/80 border border-slate-800 backdrop-blur-xl px-4 py-2.5 rounded-2xl shadow-xl">
      <a href="app.html" class="flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-cyan-400 transition">
        <span>←</span> <span>Home Deck</span>
      </a>
      <div class="flex items-center gap-2">
        <span class="text-[11px] bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 px-2.5 py-0.5 rounded-full font-extrabold flex items-center gap-1">
          <span>⚡</span> <span>Master AI Tutor</span>
        </span>
      </div>
    </header>

    <!-- Student Header Banner -->
    <div class="text-center mb-6">
      <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight">Snap & Solve Any Concept</h1>
      <p class="text-xs text-slate-400 mt-1">Class 9–12 CBSE, State Boards, NCERT Derivations, Numericals & Diagrams</p>
    </div>

    <!-- Upload & Input Card -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 mb-6 shadow-2xl space-y-4">
      
      <!-- Subject Pills -->
      <div>
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Subject</label>
        <div class="grid grid-cols-4 gap-1.5" id="subjectGrid">
          <button type="button" class="sub-btn active bg-cyan-500/20 text-cyan-300 border border-cyan-500/50 text-xs font-bold py-2 rounded-xl text-center transition" data-subject="Mathematics">Maths</button>
          <button type="button" class="sub-btn bg-slate-800/80 text-slate-400 border border-slate-700/60 text-xs font-bold py-2 rounded-xl text-center hover:text-white transition" data-subject="Physics">Physics</button>
          <button type="button" class="sub-btn bg-slate-800/80 text-slate-400 border border-slate-700/60 text-xs font-bold py-2 rounded-xl text-center hover:text-white transition" data-subject="Chemistry">Chemistry</button>
          <button type="button" class="sub-btn bg-slate-800/80 text-slate-400 border border-slate-700/60 text-xs font-bold py-2 rounded-xl text-center hover:text-white transition" data-subject="Biology">Biology</button>
        </div>
      </div>

      <!-- Photo Upload Box -->
      <label class="flex flex-col items-center justify-center border-2 border-dashed border-cyan-500/30 hover:border-cyan-400 bg-cyan-500/5 rounded-2xl p-5 cursor-pointer transition text-center group">
        <span class="text-3xl mb-1.5 group-hover:scale-110 transition-transform">📸</span>
        <span class="text-xs font-black text-white">Tap to Capture / Upload Photo</span>
        <span class="text-[10px] text-slate-400 mt-0.5">Notebook handwriting, NCERT diagrams, or printed test papers</span>
        <input id="cameraInput" type="file" accept="image/*" class="hidden" />
      </label>

      <!-- Image Preview -->
      <div id="previewContainer" class="hidden relative">
        <img id="previewImg" class="max-h-52 w-full object-contain rounded-xl border border-cyan-500/40 bg-black/60 p-1" alt="Doubt Snapshot" />
        <button type="button" id="removeImgBtn" class="absolute top-2 right-2 bg-rose-500 text-white text-xs font-bold px-2 py-1 rounded-lg shadow-lg hover:bg-rose-600 transition">✕ Remove</button>
      </div>

      <!-- Text Question Area -->
      <div>
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Or Type Academic Question</label>
        <textarea id="questionText" rows="3" placeholder="Paste your question, numerical values, or formula here..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-xs md:text-sm text-white focus:ring-2 focus:ring-cyan-500 focus:outline-none placeholder-slate-600 transition"></textarea>
      </div>

      <!-- Explanation Mode Selector -->
      <div class="grid grid-cols-3 gap-2">
        <button type="button" class="tone-btn active bg-slate-800 text-cyan-300 border border-cyan-500/40 text-[11px] font-bold py-2 rounded-xl text-center transition" data-tone="step">🧠 Step-by-Step</button>
        <button type="button" class="tone-btn bg-slate-950 text-slate-400 border border-slate-800 text-[11px] font-bold py-2 rounded-xl text-center hover:text-white transition" data-tone="tldr">⚡ Fast TL;DR</button>
        <button type="button" class="tone-btn bg-slate-950 text-slate-400 border border-slate-800 text-[11px] font-bold py-2 rounded-xl text-center hover:text-white transition" data-tone="eli10">🐣 Conceptual</button>
      </div>

      <!-- Submit Button -->
      <button id="solveBtn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-[0.98] text-slate-950 font-black py-3 rounded-2xl shadow-lg shadow-cyan-500/20 font-heading text-sm tracking-wide transition disabled:opacity-50 disabled:cursor-not-allowed">
        GET STEP-BY-STEP SOLUTION 🚀
      </button>

      <!-- Pipeline Loading State -->
      <div id="loadingPipeline" class="hidden bg-slate-950/80 border border-cyan-500/30 rounded-2xl p-4 text-center space-y-2">
        <div class="text-xs font-bold text-cyan-400 animate-pulse" id="pipelineText">🔍 Scanning tokens & mapping CBSE criteria...</div>
        <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
          <div id="pipelineBar" class="bg-gradient-to-r from-cyan-400 to-emerald-400 h-full w-1/3 transition-all duration-300"></div>
        </div>
      </div>
    </div>

    <!-- Solution Display Area -->
    <div id="solutionBox" class="hidden bg-slate-900 border border-cyan-500/30 rounded-3xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-400 flex items-center gap-1.5 font-heading">
          <span>🎯</span> <span>Master Solution</span>
        </h3>
        <button type="button" id="ttsVoiceBtn" class="text-xs font-bold bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 hover:bg-cyan-500/20 px-3 py-1 rounded-xl transition flex items-center gap-1">
          <span>🔊</span> <span id="ttsBtnLabel">Listen Voice</span>
        </button>
      </div>

      <!-- Structured Formatted Solution -->
      <div id="solutionContent" class="text-xs md:text-sm leading-relaxed text-slate-200 space-y-2.5 latex-rendered"></div>

      <!-- Follow-up Doubts Section -->
      <div class="mt-4 pt-4 border-t border-slate-800/80 space-y-2">
        <label class="block text-[11px] font-bold text-cyan-400 uppercase tracking-wider">Ask Follow-up Doubt on this Step</label>
        <div class="flex gap-2">
          <input type="text" id="followUpInput" placeholder="e.g. Why did we take negative magnification here?" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white focus:ring-2 focus:ring-cyan-500 focus:outline-none placeholder-slate-600" />
          <button type="button" id="sendFollowUpBtn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs px-4 py-2 rounded-xl transition">Ask</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let selectedSubject = 'Mathematics';
    let selectedTone = 'step';
    let uploadedImagePayload = null;
    let doubtHistory = [];
    let activeAudio = null;

    // Subject Selector
    document.querySelectorAll('.sub-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sub-btn').forEach(b => {
          b.classList.remove('active', 'bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/50');
          b.classList.add('bg-slate-800/80', 'text-slate-400', 'border-slate-700/60');
        });
        btn.classList.add('active', 'bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/50');
        btn.classList.remove('bg-slate-800/80', 'text-slate-400', 'border-slate-700/60');
        selectedSubject = btn.getAttribute('data-subject');
      });
    });

    // Tone Switcher
    document.querySelectorAll('.tone-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tone-btn').forEach(b => {
          b.classList.remove('active', 'bg-slate-800', 'text-cyan-300', 'border-cyan-500/40');
          b.classList.add('bg-slate-950', 'text-slate-400', 'border-slate-800');
        });
        btn.classList.add('active', 'bg-slate-800', 'text-cyan-300', 'border-cyan-500/40');
        btn.classList.remove('bg-slate-950', 'text-slate-400', 'border-slate-800');
        selectedTone = btn.getAttribute('data-tone');
      });
    });

    // Camera / Image File Handler with Canvas Compression
    const cameraInput = document.getElementById('cameraInput');
    const previewContainer = document.getElementById('previewContainer');
    const previewImg = document.getElementById('previewImg');
    const removeImgBtn = document.getElementById('removeImgBtn');

    cameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 1200;
          let width = img.width;
          let height = img.height;

          if (width > height && width > MAX_SIZE) {
            height *= MAX_SIZE / width;
            width = MAX_SIZE;
          } else if (height > MAX_SIZE) {
            width *= MAX_SIZE / height;
            height = MAX_SIZE;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
          uploadedImagePayload = {
            data: compressedBase64.split(',')[1],
            mimeType: 'image/jpeg'
          };

          previewImg.src = compressedBase64;
          previewContainer.classList.remove('hidden');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    removeImgBtn.addEventListener('click', () => {
      uploadedImagePayload = null;
      cameraInput.value = '';
      previewContainer.classList.add('hidden');
      previewImg.src = '';
    });

    // Solve Button Submission
    const solveBtn = document.getElementById('solveBtn');
    const questionText = document.getElementById('questionText');
    const solutionBox = document.getElementById('solutionBox');
    const solutionContent = document.getElementById('solutionContent');
    const loadingPipeline = document.getElementById('loadingPipeline');
    const pipelineText = document.getElementById('pipelineText');
    const pipelineBar = document.getElementById('pipelineBar');

    let pipelineInterval;

    function startPipeline() {
      loadingPipeline.classList.remove('hidden');
      const messages = [
        "🔍 Parsing problem tokens...",
        "📐 Checking NCERT formulas & marking scheme...",
        "🚨 Verifying examiner trap conditions...",
        "✨ Formulating clean step-by-step breakdown..."
      ];
      let idx = 0;
      let progress = 20;
      pipelineBar.style.width = '20%';
      pipelineText.textContent = messages[0];

      clearInterval(pipelineInterval);
      pipelineInterval = setInterval(() => {
        idx = (idx + 1) % messages.length;
        progress = Math.min(progress + 25, 90);
        pipelineText.textContent = messages[idx];
        pipelineBar.style.width = progress + '%';
      }, 1500);
    }

    function stopPipeline() {
      clearInterval(pipelineInterval);
      loadingPipeline.classList.add('hidden');
    }

    solveBtn.addEventListener('click', async () => {
      const q = questionText.value.trim();
      if (!q && !uploadedImagePayload) {
        alert('Please enter a question or snap a photo first.');
        return;
      }

      solveBtn.disabled = true;
      solutionBox.classList.add('hidden');
      startPipeline();
      doubtHistory = [];

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject: selectedSubject,
            question: q,
            image: uploadedImagePayload,
            tone: selectedTone,
            history: []
          })
        });

        const data = await res.json();
        if (!res.ok || !data.answer) throw new Error(data.error || 'Failed to solve doubt.');

        doubtHistory.push({ role: 'user', content: q || 'Image Attachment' });
        doubtHistory.push({ role: 'assistant', content: data.answer });

        solutionContent.innerHTML = marked.parse(data.answer);

        if (window.MathJax && MathJax.typesetPromise) {
          await MathJax.typesetPromise([solutionContent]);
        }

        solutionBox.classList.remove('hidden');
        solutionBox.scrollIntoView({ behavior: 'smooth', block: 'start' });

      } catch (err) {
        alert('Doubt Resolution Error: ' + err.message);
      } finally {
        stopPipeline();
        solveBtn.disabled = false;
      }
    });

    // Follow-up Doubt Submissions
    const sendFollowUpBtn = document.getElementById('sendFollowUpBtn');
    const followUpInput = document.getElementById('followUpInput');

    sendFollowUpBtn.addEventListener('click', async () => {
      const followQ = followUpInput.value.trim();
      if (!followQ) return;

      sendFollowUpBtn.disabled = true;
      sendFollowUpBtn.innerText = '...';

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject: selectedSubject,
            question: followQ,
            tone: selectedTone,
            history: doubtHistory
          })
        });

        const data = await res.json();
        if (!res.ok || !data.answer) throw new Error(data.error || 'Failed follow-up');

        doubtHistory.push({ role: 'user', content: followQ });
        doubtHistory.push({ role: 'assistant', content: data.answer });

        const followUpNode = document.createElement('div');
        followUpNode.className = 'mt-3 pt-3 border-t border-slate-800';
        followUpNode.innerHTML = `
          <div class="text-[11px] font-extrabold text-cyan-400 mb-1">🙋 Follow-up: ${followQ}</div>
          <div class="text-xs text-slate-300 leading-relaxed">${marked.parse(data.answer)}</div>
        `;
        solutionContent.appendChild(followUpNode);

        if (window.MathJax && MathJax.typesetPromise) {
          await MathJax.typesetPromise([followUpNode]);
        }

        followUpInput.value = '';
      } catch (err) {
        alert('Follow-up error: ' + err.message);
      } finally {
        sendFollowUpBtn.disabled = false;
        sendFollowUpBtn.innerText = 'Ask';
      }
    });

    // TTS Voice Explanation Handler
    const ttsVoiceBtn = document.getElementById('ttsVoiceBtn');
    const ttsBtnLabel = document.getElementById('ttsBtnLabel');

    ttsVoiceBtn.addEventListener('click', async () => {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
        ttsBtnLabel.innerText = 'Listen Voice';
        return;
      }

      const textToRead = solutionContent.innerText;
      if (!textToRead) return;

      ttsBtnLabel.innerText = 'Generating Voice...';

      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: textToRead,
            languageCode: 'hi-IN',
            speakingRate: 1.05
          })
        });

        const data = await res.json();
        if (!data.success || !data.audioBase64) throw new Error(data.error || 'Speech synthesis failed.');

        activeAudio = new Audio(data.audioBase64);
        ttsBtnLabel.innerText = '⏹ Stop Voice';
        activeAudio.play();

        activeAudio.onended = () => {
          activeAudio = null;
          ttsBtnLabel.innerText = 'Listen Voice';
        };
      } catch (err) {
        alert('Audio error: ' + err.message);
        ttsBtnLabel.innerText = 'Listen Voice';
      }
    });
  </script>
</body>
</html>
