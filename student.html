<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Doubt Solver - DoubtDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-xl mx-auto p-4 md:py-8">
    
    <!-- Top Navigation Bar -->
    <div class="flex justify-between items-center mb-6">
      <a href="/portal.html" class="text-xs text-slate-400 hover:text-white transition">← Switch Mode</a>
      <span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded-full font-bold">
        ⚡ Instant AI Doubts
      </span>
    </div>

    <!-- Student Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-white">Snap & Solve Any Doubt</h1>
      <p class="text-xs text-slate-400 mt-1">Maths, Science, NCERT word problems, and diagrams</p>
    </div>

    <!-- Upload & Input Card -->
    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 mb-6 shadow-lg">
      <label class="flex flex-col items-center justify-center border-2 border-dashed border-emerald-500/40 hover:border-emerald-400 bg-emerald-500/5 rounded-xl p-6 cursor-pointer transition text-center">
        <span class="text-3xl mb-2">📸</span>
        <span class="text-sm font-bold text-white">Tap to Snap Question Photo</span>
        <span class="text-xs text-slate-400 mt-1">Supports textbook photos & notebook handwriting</span>
        <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden" />
      </label>

      <div id="previewContainer" class="hidden mt-4 text-center">
        <img id="previewImg" class="max-h-48 mx-auto rounded-lg border border-slate-600" />
      </div>

      <div class="my-3 text-center text-xs text-slate-500 uppercase font-bold tracking-wider">or type doubt</div>

      <textarea id="questionText" rows="3" placeholder="Type your question or formula here..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none placeholder-slate-500"></textarea>

      <div class="mt-4 flex gap-2">
        <select id="langSelect" class="bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-300">
          <option value="Hinglish">Simple Hinglish</option>
          <option value="English">English</option>
          <option value="Hindi">Pure Hindi</option>
        </select>
        <button id="solveBtn" class="flex-1 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-slate-950 font-black py-2.5 rounded-xl shadow-lg transition disabled:bg-slate-600">
          Get Instant Solution 🚀
        </button>
      </div>
    </div>

    <!-- Solution Display Area -->
    <div id="solutionBox" class="hidden bg-slate-800 border border-emerald-500/40 rounded-2xl p-5 shadow-xl space-y-3">
      <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400">Step-by-Step Explanation</h3>
      <div id="solutionText" class="text-sm leading-relaxed whitespace-pre-wrap text-slate-200"></div>
    </div>

  </div>

  <script>
    let studentImageB64 = null;
    const cameraInput = document.getElementById('cameraInput');
    const previewContainer = document.getElementById('previewContainer');
    const previewImg = document.getElementById('previewImg');
    const solveBtn = document.getElementById('solveBtn');
    const solutionBox = document.getElementById('solutionBox');
    const solutionText = document.getElementById('solutionText');

    cameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          studentImageB64 = ev.target.result;
          previewImg.src = ev.target.result;
          previewContainer.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    solveBtn.addEventListener('click', async () => {
      const text = document.getElementById('questionText').value.trim();
      const language = document.getElementById('langSelect').value;

      if (!text && !studentImageB64) {
        alert('Please snap a photo or type a question first!');
        return;
      }

      solveBtn.disabled = true;
      solveBtn.innerText = 'AI Solving Step-by-Step...';
      solutionBox.classList.add('hidden');

      try {
        const res = await fetch('/api/ocr-paper', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            inputType: studentImageB64 ? 'camera' : 'text',
            chapterName: `Explain this doubt step-by-step in ${language}: ${text}`,
            rawText: text,
            imageBase64Array: studentImageB64 ? [studentImageB64] : [],
            examType: 'Doubt Solution'
          })
        });

        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        const firstQ = data.exam?.sections?.[0]?.questions?.[0];
        solutionText.innerText = firstQ?.answer_key || firstQ?.question_text || JSON.stringify(data.exam, null, 2);
        solutionBox.classList.remove('hidden');
        solutionBox.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        alert('Could not solve: ' + err.message);
      } finally {
        solveBtn.disabled = false;
        solveBtn.innerText = 'Get Instant Solution 🚀';
      }
    });
  </script>
</body>
</html>
