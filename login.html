<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Studio Login - DoubtDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
    
    <div class="flex justify-between items-center mb-6">
      <a href="/index.html" class="text-xs text-slate-400 hover:text-white transition">← Workspace Select</a>
      <span class="text-[10px] font-bold uppercase tracking-wider bg-indigo-950 text-indigo-400 border border-indigo-800/50 px-2.5 py-1 rounded-full">
        Teacher Portal
      </span>
    </div>

    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-500/10 border border-indigo-500/30 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3">
        👩‍🏫
      </div>
      <h1 class="text-2xl font-black text-white">Teacher Studio</h1>
      <p class="text-xs text-slate-400 mt-1">Enter your teacher email to access exam creation & grading tools</p>
    </div>

    <form id="teacherLoginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Teacher Name / Email</label>
        <input 
          id="teacherEmail" 
          type="text" 
          required
          placeholder="e.g. Piyush Sir / pyus5411@gmail.com"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Passcode (Default: teacher360)</label>
        <input 
          id="teacherPasscode" 
          type="password" 
          placeholder="teacher360"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <button 
        type="submit" 
        id="enterBtn" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-xl text-sm transition active:scale-95 shadow-lg mt-2"
      >
        Enter Teacher Studio 🚀
      </button>
    </form>

    <div id="statusMsg" class="hidden mt-4 text-xs text-center p-3 rounded-xl"></div>

  </div>

  <script>
    const form = document.getElementById('teacherLoginForm');
    const emailInput = document.getElementById('teacherEmail');
    const passInput = document.getElementById('teacherPasscode');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = (emailInput.value || '').trim();
      const pass = (passInput.value || '').trim();

      if (!email) {
        statusMsg.textContent = "Please enter your name or email";
        statusMsg.className = "mt-4 text-xs text-center p-3 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20";
        statusMsg.classList.remove('hidden');
        return;
      }

      // Save teacher session locally
      localStorage.setItem('doubt_desk_teacher', email);
      localStorage.setItem('doubt_desk_auth_time', Date.now().toString());

      statusMsg.textContent = "Access Granted! Loading Teacher Studio...";
      statusMsg.className = "mt-4 text-xs text-center p-3 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
      statusMsg.classList.remove('hidden');

      setTimeout(function() {
        window.location.replace('/test-maker.html');
      }, 500);
    });
  </script>
</body>
</html>
