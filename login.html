<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Studio Login - DoubtDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
    
    <!-- Top Mode Switch -->
    <div class="flex justify-between items-center mb-6">
      <a href="/index.html" class="text-xs text-slate-400 hover:text-white transition">← Workspace Select</a>
      <span class="text-[10px] font-bold uppercase tracking-wider bg-indigo-950 text-indigo-400 border border-indigo-800/50 px-2.5 py-1 rounded-full">
        Teacher Portal
      </span>
    </div>

    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-500/10 border border-indigo-500/30 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3">
        👩‍🏫
      </div>
      <h1 class="text-2xl font-black text-white">Teacher Studio</h1>
      <p class="text-xs text-slate-400 mt-1">Sign in with email and password to access your papers & 7-day archive</p>
    </div>

    <!-- Login Form -->
    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Teacher Email</label>
        <input 
          id="emailInput" 
          type="email" 
          required 
          placeholder="teacher@school.com"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <input 
          id="passwordInput" 
          type="password" 
          required 
          placeholder="Enter or create your password"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <div class="flex gap-2 pt-2">
        <!-- Sign In Button -->
        <button 
          type="submit" 
          id="signInBtn" 
          class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition active:scale-95 shadow-lg"
        >
          Sign In
        </button>

        <!-- Sign Up Button -->
        <button 
          type="button" 
          id="signUpBtn" 
          class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl text-sm border border-slate-700 transition active:scale-95"
        >
          Create Account
        </button>
      </div>
    </form>

    <!-- Error/Status Box -->
    <div id="statusMsg" class="hidden mt-4 text-xs text-center p-3 rounded-xl"></div>

  </div>

  <script>
    const SUPABASE_URL = "https://wixmznptxupwcvgqjexk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpeG16bnB0eHVwd2N2Z3FqZXhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3MDM3NDcsImV4cCI6MjA2MjI3OTc0N30.i9gCj1Z_WvWw2p_oXUuXm2T6wzBv4R0YJ6T0B3_HjZk";
    
    let supabaseClient = null;
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e) {
      console.warn("Supabase init fallback:", e);
    }

    const authForm = document.getElementById('authForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const signInBtn = document.getElementById('signInBtn');
    const signUpBtn = document.getElementById('signUpBtn');
    const statusMsg = document.getElementById('statusMsg');

    function showStatus(text, isError = false) {
      statusMsg.textContent = text;
      statusMsg.className = `mt-4 text-xs text-center p-3 rounded-xl ${isError ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}`;
      statusMsg.classList.remove('hidden');
    }

    // 1. Sign In Action
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      signInBtn.disabled = true;
      signInBtn.textContent = "Signing in...";

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;

        showStatus("Success! Redirecting to Test Studio...", false);
        setTimeout(() => {
          window.location.href = "/test-maker.html";
        }, 800);
      } catch (err) {
        showStatus("Sign In Failed: " + err.message, true);
      } finally {
        signInBtn.disabled = false;
        signInBtn.textContent = "Sign In";
      }
    });

    // 2. Sign Up Action (Create Account)
    signUpBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showStatus("Please enter both email and password to create an account.", true);
        return;
      }

      signUpBtn.disabled = true;
      signUpBtn.textContent = "Creating...";

      try {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;

        showStatus("Account created! Logging you in...", false);
        setTimeout(() => {
          window.location.href = "/test-maker.html";
        }, 800);
      } catch (err) {
        showStatus("Account Error: " + err.message, true);
      } finally {
        signUpBtn.disabled = false;
        signUpBtn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
