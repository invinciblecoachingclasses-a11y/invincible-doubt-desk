<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Login - DoubtDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
    
    <div class="mb-6">
      <span class="text-4xl mb-2 block">🎓</span>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Teacher Access</h1>
      <p class="text-sm text-slate-500 mt-2">Sign in to generate exams and grade sheets. <br><span class="text-rose-600 font-semibold">Note: All generated data auto-deletes after 7 days for security.</span></p>
    </div>

    <div id="loginForm" class="space-y-4">
      <input id="emailInput" type="email" placeholder="Enter your email address" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center" />
      <button id="sendLinkBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 rounded-xl shadow-md transition">
        Send Magic Login Link
      </button>
    </div>

    <div id="successMessage" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl p-4 text-sm font-medium">
      ✨ Magic link sent! Check your email inbox (and spam folder) and click the link to log in.
    </div>

  </div>

  <script>
    const supabaseUrl = 'https://cbgwbzidkmcefoithipp.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNiZ3diemlka21jZWZvaXRoaXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDgyNTQsImV4cCI6MjEwMTc4NDI1NH0.gJq3-0tU-8fxdF0Y_1_qcet_VYp7gysv5yWfl_o8T0g';
    
    let supabaseClient;
    try {
      supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
    } catch (e) {
      console.error("Supabase init failed", e);
    }

    const sendLinkBtn = document.getElementById('sendLinkBtn');
    const emailInput = document.getElementById('emailInput');
    const loginForm = document.getElementById('loginForm');
    const successMessage = document.getElementById('successMessage');

    sendLinkBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      
      if (!email) {
        alert('Please enter your email address first.');
        return;
      }

      if (!supabaseAnonKey || supabaseAnonKey.includes('PASTE_YOUR')) {
        alert('Please paste your actual Supabase Anon Key in the code first.');
        return;
      }

      sendLinkBtn.disabled = true;
      sendLinkBtn.innerText = 'Sending Link...';

      try {
        const { error } = await supabaseClient.auth.signInWithOtp({
          email: email,
          options: {
            emailRedirectTo: window.location.origin + '/history.html'
          }
        });

        if (error) {
          alert('Login Error: ' + error.message);
          sendLinkBtn.disabled = false;
          sendLinkBtn.innerText = 'Send Magic Login Link';
        } else {
          loginForm.classList.add('hidden');
          successMessage.classList.remove('hidden');
        }
      } catch (err) {
        alert('System Error: ' + err.message);
        sendLinkBtn.disabled = false;
        sendLinkBtn.innerText = 'Send Magic Login Link';
      }
    });
  </script>
</body>
</html>
