<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Studio Login - DoubtDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
    
    <div class="flex justify-between items-center mb-6">
      <a href="/index.html" class="text-xs text-slate-400 hover:text-white transition">← Workspace Select</a>
      <span class="text-[10px] font-bold uppercase tracking-wider bg-indigo-950 text-indigo-400 border border-indigo-800/50 px-2.5 py-1 rounded-full">
        Teacher Portal
      </span>
    </div>

    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-500/10 border border-indigo-500/30 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3">
        👩‍🏫
      </div>
      <h1 class="text-2xl font-black text-white">Teacher Studio</h1>
      <p class="text-xs text-slate-400 mt-1">Sign in with email and password to access your papers & 7-day archive</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Teacher Email</label>
        <input 
          id="emailInput" 
          type="email" 
          autocomplete="email"
          placeholder="teacher@school.com"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <input 
          id="passwordInput" 
          type="password" 
          autocomplete="current-password"
          placeholder="••••••••"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <div class="flex gap-2 pt-2">
        <button 
          id="signInBtn" 
          type="button"
          class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition active:scale-95 shadow-lg"
        >
          Sign In
        </button>

        <button 
          id="signUpBtn" 
          type="button"
          class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl text-sm border border-slate-700 transition active:scale-95"
        >
          Create Account
        </button>
      </div>
    </div>

    <div id="statusMsg" class="hidden mt-4 text-xs text-center p-3 rounded-xl"></div>

  </div>

  <script>
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const signInBtn = document.getElementById('signInBtn');
    const signUpBtn = document.getElementById('signUpBtn');
    const statusMsg = document.getElementById('statusMsg');

    function showStatus(text, isError = false) {
      statusMsg.textContent = text;
      statusMsg.className = `mt-4 text-xs text-center p-3 rounded-xl ${isError ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}`;
      statusMsg.classList.remove('hidden');
    }

    async function handleAuth(action) {
      const email = (emailInput.value || '').trim();
      const password = (passwordInput.value || '').trim();

      if (!email || !password) {
        showStatus("Please enter both email and password.", true);
        return;
      }

      const activeBtn = action === 'signin' ? signInBtn : signUpBtn;
      activeBtn.disabled = true;
      activeBtn.textContent = action === 'signin' ? "Signing in..." : "Creating...";

      try {
        const fullUrl = window.location.origin + '/api/auth';
        const response = await fetch(fullUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: action, email: email, password: password })
        });

        const resData = await response.json();
        if (!response.ok) {
          throw new Error(resData.error || 'Request failed');
        }

        if (resData.data && resData.data.access_token) {
          localStorage.setItem('sb-token', resData.data.access_token);
        }

        showStatus(action === 'signin' ? "Success! Redirecting..." : "Account created! Redirecting...", false);
        setTimeout(() => { window.location.href = "/test-maker.html"; }, 700);
      } catch (err) {
        showStatus("Error: " + err.message, true);
      } finally {
        activeBtn.disabled = false;
        activeBtn.textContent = action === 'signin' ? "Sign In" : "Create Account";
      }
    }

    signInBtn.addEventListener('click', () => handleAuth('signin'));
    signUpBtn.addEventListener('click', () => handleAuth('signup'));
  </script>
</body>
</html>
